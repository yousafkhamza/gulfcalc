name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Site settings come from repository variables (Settings > Secrets and variables > Actions > Variables).
    # All are optional; see docs/ADSENSE.md.
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      ADS_ENABLED: ${{ vars.ADS_ENABLED }}
      ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT }}
      ADSENSE_SLOT_IN_CONTENT: ${{ vars.ADSENSE_SLOT_IN_CONTENT }}
      ADSENSE_SLOT_SIDEBAR: ${{ vars.ADSENSE_SLOT_SIDEBAR }}
      ADSENSE_SLOT_HOME: ${{ vars.ADSENSE_SLOT_HOME }}
      GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unit tests
        run: npm test

      - name: Build site
        run: npm run build

      - name: Check pages and links
        run: npm run check

      - name: Upload site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Builds the site the way it will look after the steps in docs/ADSENSE.md (custom domain, ads on,
  # manual ad slots) and as a local preview, and runs the same checks. Nothing here is deployed.
  variants:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: custom domain with ads
            site_url: https://example.com
            ads_enabled: 'true'
            adsense_client: ca-pub-1234567890123456
            slot: '1111111111'
          - name: custom domain before AdSense approval
            site_url: https://example.com
            ads_enabled: 'false'
            adsense_client: ca-pub-1234567890123456
            slot: ''
          - name: local preview
            site_url: http://localhost:8080
            ads_enabled: ''
            adsense_client: ''
            slot: ''
    name: variant (${{ matrix.name }})
    env:
      SITE_URL: ${{ matrix.site_url }}
      ADS_ENABLED: ${{ matrix.ads_enabled }}
      ADSENSE_CLIENT: ${{ matrix.adsense_client }}
      ADSENSE_SLOT_IN_CONTENT: ${{ matrix.slot }}
      ADSENSE_SLOT_SIDEBAR: ${{ matrix.slot }}
      ADSENSE_SLOT_HOME: ${{ matrix.slot }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build site
        run: npm run build
      - name: Check pages and links
        run: npm run check

  lint-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, variants, lint-workflows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
